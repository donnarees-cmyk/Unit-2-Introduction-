<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three-Day ELA Foundations • Florida Standards Sprints</title><style>
:root{--ink:#173f49;--teal:#087f8c;--sand:#fff4d8}*{box-sizing:border-box}body{margin:0;background:#edf8f7;color:var(--ink);font:18px/1.6 system-ui,sans-serif}header{background:#173f49;color:white;padding:24px max(20px,calc((100vw - 1000px)/2));}h1{font-size:clamp(26px,5vw,40px);margin:6px 0}header p{margin:4px 0}main{max-width:1000px;margin:22px auto;padding:0 18px}.panel{background:white;border-radius:18px;padding:clamp(18px,4vw,36px);box-shadow:0 8px 30px #173f4910}h2{line-height:1.25}button{font:inherit;background:var(--teal);color:white;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;margin:7px 5px 7px 0}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #dc9a1a;outline-offset:3px}input,textarea{font:inherit}input[type=text],input:not([type]),textarea{width:100%;padding:10px;border:2px solid #9cbfc3;border-radius:8px}textarea{display:block;margin:8px 0 18px;min-height:110px}label.writing{display:block;font-weight:600;margin:18px 0}.callout{background:var(--sand);border-left:5px solid #e2aa37;padding:18px;margin:20px 0}.passage{background:#f2f8fa;border:1px solid #b8d7dc;padding:22px;border-radius:12px;margin:20px 0}.question{border-top:2px solid #d7e9eb;margin-top:25px;padding-top:20px}.badge{font-size:14px;font-weight:bold;color:#086875}.option{display:block;padding:12px;border:1px solid #bdd8da;border-radius:8px;margin:8px 0;cursor:pointer}.option:has(input:checked){background:#d7f1ef;border-color:var(--teal)}input[type=radio],input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:var(--teal)}table{border-collapse:collapse;width:100%;font-size:16px}td,th{padding:12px;text-align:left;vertical-align:top;border:1px solid #b9d5d7}th{background:#dff2f1}.feedback{background:#edf6f2;padding:12px;display:none}nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}nav button{font-size:14px;margin:0;background:#45656c}nav button.current{background:#087f8c}progress{width:100%;height:12px;accent-color:#e8b745}.footer{display:flex;justify-content:space-between;margin:14px 0}details{margin:16px 0;border:1px solid #bed6d9;padding:14px;border-radius:8px}summary{cursor:pointer;font-weight:bold}.muted{font-size:14px}#report{white-space:pre-wrap;background:#fff8e8;padding:20px;margin-top:20px;overflow-wrap:anywhere}#report:empty{display:none}@media(max-width:600px){td,th{padding:7px;font-size:14px}.panel{padding:18px}.passage{padding:14px}}@media print{body{background:white;font-size:12pt}header,nav,.footer,#teacher,.panel>*{display:none!important}.panel #report{display:block!important;white-space:pre-wrap;background:white;padding:0}.panel{box-shadow:none;padding:0}main{margin:0;max-width:none}#report{border:0}}
.daypicker{display:flex;gap:8px;flex-wrap:wrap}.daypicker button{background:#173f49}.dailyreport{white-space:pre-wrap;background:#fff8e8;padding:18px;margin-top:20px;overflow-wrap:anywhere}.dailyreport:empty{display:none}@media print{.daypicker{display:none!important}.panel .dailyreport.printme{display:block!important;background:white;padding:0}body.dailyprint #report{display:none!important}}</style></head><body><header><p>🌊 FLORIDA STANDARDS SPRINTS • GRADE 6 ELA</p><h1>Three-Day ELA Foundations</h1><p>Learn the language • Build your response • Read for meaning</p><progress id="progress" max="12" value="1"></progress></header><main><div class="daypicker" aria-label="Choose lesson day"><button data-start="0">Day 1 • Vocabulary</button><button data-start="4">Day 2 • Writing & Discussion</button><button data-start="8">Day 3 • Informational Reading</button></div><nav id="nav" aria-label="Lesson sections"></nav><article id="panel" class="panel"></article><div class="footer"><button id="back">← Back</button><button id="next">Next →</button></div></main><script>
const sections=[{"title": "D1 \u2022 Words for learning", "body": "<h2>Day 1: Your learning goals</h2><p><b>Focus:</b> ELA.6.V.1.1 and ELA.6.V.1.2</p><div class=\"callout\"><b>I can\u2026</b><ul><li>Explain common academic directions.</li><li>Use academic words accurately in speaking and writing.</li><li>Use Greek/Latin roots and affixes to propose and check a word\u2019s meaning.</li></ul></div><p>Follow your teacher through the explanations. Pause when you see <b>TRY WITH ME</b>. Work on your own when you see <b>INDEPENDENT</b>. Read the feedback after committing to an answer.</p><label>Your name <input id=\"student\" placeholder=\"First and last name\"></label><h2>WATCH ME: Decode what a task asks you to do</h2><p><b>Academic vocabulary</b> includes words used across school subjects: analyze, interpret, evidence, compare, contrast, infer, and justify. Knowing a definition is a start. Using the word to communicate a real idea is the goal.</p><table><tr><th>Word</th><th>Student-friendly meaning</th><th>What your work should show</th></tr><tr><td>Analyze</td><td>Examine parts and their relationships.</td><td>Explain how a detail helps create meaning.</td></tr><tr><td>Interpret</td><td>Explain what something means.</td><td>Explain what words, an image, or a result suggest.</td></tr><tr><td>Evidence</td><td>Relevant information supporting an idea.</td><td>Use a specific detail, quotation, or observation.</td></tr><tr><td>Infer</td><td>Reach a supported conclusion not directly stated.</td><td>Combine clues with reasoning.</td></tr><tr><td>Compare / contrast</td><td>Explain similarities / differences.</td><td>Discuss both subjects using the same point of comparison.</td></tr><tr><td>Justify</td><td>Give reasons that support a decision.</td><td>Explain why your evidence supports your answer.</td></tr></table><div class=\"passage\"><p>\u201cLeah held her completed speech behind her back. When her name was called, she asked whether someone else could go first.\u201d</p><p><b>Think-aloud:</b> I infer that Leah may feel nervous. My evidence is her request to delay speaking, even though her speech is finished. That evidence supports nervousness more than a claim that she forgot her work. I should say \u201cmay\u201d because the writer has not told us her feelings directly.</p></div><div class=\"callout\"><b>Memory rule: Don\u2019t just name it. Explain it.</b><p>Weak: \u201cThere is evidence.\u201d Strong: \u201cLeah\u2019s request to wait is evidence that she may feel nervous.\u201d</p></div><div class=\"question\" data-id=\"q1\" data-answer=\"1\" data-why=\"Analysis examines a part and explains how it relates to the whole meaning.\"><span class=\"badge\">Select one</span><h3>What does \u201canalyze how the ending affects the reader\u2019s understanding\u201d ask you to do?</h3><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"0\"> Copy the last sentence only.</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"1\"> Explain the relationship between the ending and the meaning of the text.</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"2\"> List the characters without explaining them.</label><label class=\"option\"><input type=\"radio\" name=\"q1\" value=\"3\"> Tell whether you liked the story.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q2\" data-answer=\"2\" data-why=\"The response names a relevant detail and explains the supported inference without overclaiming.\"><span class=\"badge\">Select one</span><h3>Which response uses evidence most effectively?</h3><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"0\"> Leah is nervous because I said so.</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"1\"> Leah is definitely never prepared.</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"2\"> Leah may be nervous because she asks another person to speak first even though her speech is ready.</label><label class=\"option\"><input type=\"radio\" name=\"q2\" value=\"3\"> Evidence is a word with eight letters.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q3\" data-answer=\"1\" data-why=\"Contrast identifies a difference on a shared point: willingness to begin speaking.\"><span class=\"badge\">Select one</span><h3>Which statement CONTRASTS two responses?</h3><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"0\"> Both students completed speeches.</label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"1\"> Leah delays speaking, while Ren volunteers to begin.</label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"2\"> Leah and Ren are students.</label><label class=\"option\"><input type=\"radio\" name=\"q3\" value=\"3\"> Both speeches have introductions.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div>"}, {"title": "D1 \u2022 Word-part detective", "body": "<h2>WATCH ME: A word can carry clues inside it</h2><p>A <b>root</b> carries a core meaning. A <b>prefix</b> appears before a base/root; a <b>suffix</b> appears after it. Roots and affixes help you make an informed prediction, but the whole word and sentence must make sense together.</p><table><tr><th>Part</th><th>Meaning</th><th>Examples</th></tr><tr><td>graph (Greek root)</td><td>write / record</td><td>autograph, biography</td></tr><tr><td>bio (Greek combining form)</td><td>life</td><td>biography, biology</td></tr><tr><td>auto (Greek combining form)</td><td>self</td><td>autobiography</td></tr><tr><td>spect (Latin root)</td><td>look / see</td><td>inspect, spectator</td></tr><tr><td>port (Latin root)</td><td>carry</td><td>transport, portable</td></tr><tr><td>re- (prefix)</td><td>again / back</td><td>reread, rebuild</td></tr><tr><td>pre- (prefix)</td><td>before</td><td>preview, pretest</td></tr><tr><td>-able (suffix)</td><td>able to be</td><td>portable, readable</td></tr><tr><td>-er / -or (suffixes)</td><td>a person who does something</td><td>reader, spectator</td></tr></table><div class=\"callout\"><b>Break \u2192 Predict \u2192 Check.</b><ol><li>Break the word into meaningful parts you recognize.</li><li>Predict a meaning from the parts.</li><li>Check the sentence and, if needed, a dictionary. Parts are clues, not a guarantee.</li></ol></div><div class=\"passage\"><h3>Worked example: portable</h3><p>\u201cThe team used a portable display that could be carried between classrooms.\u201d<br>port = carry; -able = able to be.<br>Prediction: able to be carried.<br>Sentence check: carrying the display between rooms supports that meaning.</p><h3>Worked example: autobiography</h3><p>auto = self; bio = life; graph = writing. An autobiography is an account of a person\u2019s life written by that person. The parts suggest its meaning; the established whole-word meaning makes the definition precise.</p></div><p><b>Don\u2019t force a false match:</b> \u201cre-\u201d can mean again, but not every word beginning with the letters r-e has that prefix. \u201cReal\u201d does not mean \u201cagain + al.\u201d</p><div class=\"question\" data-id=\"q4\" data-answer=\"1\" data-why=\"The prefix re- means again in reread. The context supports another reading.\"><span class=\"badge\">Select one</span><h3>Which meaning best fits \u201cThe students reread the confusing paragraph\u201d?</h3><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"0\"> Read it before it is written.</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"1\"> Read it again.</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"2\"> Carry the paragraph.</label><label class=\"option\"><input type=\"radio\" name=\"q4\" value=\"3\"> Look away from it.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q5\" data-answer=\"2\" data-why=\"The Latin root spect relates to looking or seeing. A spectator is a person who watches.\"><span class=\"badge\">Select one</span><h3>A spectator watches a performance. Which root helps explain the meaning?</h3><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"0\"> port: carry</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"1\"> bio: life</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"2\"> spect: look or see</label><label class=\"option\"><input type=\"radio\" name=\"q5\" value=\"3\"> graph: write</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q6\" data-answer=\"3\" data-why=\"Use word parts together with context and reference tools rather than forcing an incorrect meaning.\"><span class=\"badge\">Select one</span><h3>What is the best method when a word-part prediction does not fit the sentence?</h3><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"0\"> Keep the prediction regardless of context.</label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"1\"> Ignore every unfamiliar word.</label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"2\"> Choose the longest definition.</label><label class=\"option\"><input type=\"radio\" name=\"q6\" value=\"3\"> Check the sentence and consult a reliable reference if needed.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">TRY WITH ME: Explain \u201cpreview\u201d in \u201cBefore reading, we previewed the headings.\u201d Identify the prefix, propose a meaning, and explain how the sentence confirms it.<textarea id=\"d1guided\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label>"}, {"title": "D1 \u2022 Read and apply", "body": "<div class=\"passage\"><h3>INDEPENDENT: Choosing What Matters \u2022 Original passage</h3><p><b>[1]</b> Our class planned a portable exhibit about the history of our school. At first, we wanted to collect every photograph we could find. Mrs. Vega asked us to analyze what each photograph would help visitors understand. A picture could be interesting without being useful evidence for our chosen topic.</p><p><b>[2]</b> I interviewed my grandfather, who had attended the school years earlier. He offered to sign the back of his class photograph. His autograph made the photograph feel personal, but it did not tell us when the image was taken. We still needed to inspect the school records and compare the date with his memory.</p><p><b>[3]</b> Another group found a biography of a former principal. The book described her life, but it had been written by someone else. We used one paragraph to explain why she created a school garden. Before adding it to our exhibit, we reread it and paraphrased the information in our own words.</p><p><b>[4]</b> When we presented the exhibit, visitors asked why we had left out several colorful photographs. We justified our choices by explaining how each selected item supported the history we wanted to communicate. Our display had fewer pictures than we first imagined, but each one had a clearer purpose.</p></div><p>Reread the numbered paragraphs. Use the meaning of a word and the role it plays in the sentence. You are using vocabulary to understand real decisions, not memorizing isolated definitions.</p><div class=\"question\" data-id=\"q7\" data-answer=\"1\" data-why=\"Students consider how each item connects to the exhibit\u2019s purpose.\"><span class=\"badge\">Select one</span><h3>What does \u201canalyze\u201d mean in paragraph 1?</h3><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"0\"> Count the letters in each photograph\u2019s caption.</label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"1\"> Examine how each photograph contributes to visitors\u2019 understanding.</label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"2\"> Choose every colorful picture.</label><label class=\"option\"><input type=\"radio\" name=\"q7\" value=\"3\"> Carry the display to another room.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q8\" data-answer=\"0\" data-why=\"Auto suggests self and graph suggests writing. Signing the photograph makes the whole-word meaning precise.\"><span class=\"badge\">Select one</span><h3>What is an autograph, based on its parts AND this context?</h3><label class=\"option\"><input type=\"radio\" name=\"q8\" value=\"0\"> A person\u2019s own signature.</label><label class=\"option\"><input type=\"radio\" name=\"q8\" value=\"1\"> A book written by a stranger.</label><label class=\"option\"><input type=\"radio\" name=\"q8\" value=\"2\"> A photograph with no writing.</label><label class=\"option\"><input type=\"radio\" name=\"q8\" value=\"3\"> A box that carries pictures.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q9\" data-answer=\"0,2\" data-why=\"Port relates to carrying; spect relates to looking. Biography need not be self-written, and re- in reread means again.\"><span class=\"badge\">Select 2</span><h3>Which TWO statements correctly apply word-part meanings to this text?</h3><label class=\"option\"><input type=\"checkbox\" name=\"q9\" value=\"0\"> Portable suggests that the exhibit can be carried.</label><label class=\"option\"><input type=\"checkbox\" name=\"q9\" value=\"1\"> Biography means a life account necessarily written by its subject.</label><label class=\"option\"><input type=\"checkbox\" name=\"q9\" value=\"2\"> Inspect involves looking at something carefully.</label><label class=\"option\"><input type=\"checkbox\" name=\"q9\" value=\"3\"> Reread means to read for the first time.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q10\" data-answer=\"0\" data-why=\"Justification gives reasons that support a choice.\"><span class=\"badge\">Select one</span><h3>Which sentence accurately uses \u201cjustify\u201d to explain the group\u2019s work?</h3><label class=\"option\"><input type=\"radio\" name=\"q10\" value=\"0\"> We justify our selection by explaining how the records support the history in our exhibit.</label><label class=\"option\"><input type=\"radio\" name=\"q10\" value=\"1\"> We justify the picture by painting it teal.</label><label class=\"option\"><input type=\"radio\" name=\"q10\" value=\"2\"> We justify because we never need reasons.</label><label class=\"option\"><input type=\"radio\" name=\"q10\" value=\"3\"> We justify means that we carry a box.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">Explain why the autograph alone was not enough evidence for the photograph\u2019s date. Use the academic words \u201cevidence\u201d and \u201ccompare\u201d naturally in your explanation.<textarea id=\"d1apply\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label><label class=\"writing\">You are choosing items for a display about a school club. Explain how you would decide what to include. Choose academic vocabulary that helps communicate your reasoning.<textarea id=\"d1transfer\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label>"}, {"title": "D1 \u2022 Remember and reflect", "body": "<h2>What you should remember</h2><div class=\"callout\">Academic words tell you what kind of thinking to do.<br>Word parts help you predict meaning.<br><b>Break \u2192 Predict \u2192 Check.</b></div><p>Say aloud to a partner or to yourself: \u201cOne useful piece of evidence in the exhibit passage is ___. It supports ___ because ___.\u201d Listen for whether your reasoning connects the detail to your idea.</p><label class=\"writing\">Exit ticket: Explain the difference between \u201canalyze\u201d and \u201cjustify.\u201d Then explain how the root port helps you understand portable.<textarea id=\"d1exit\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label><h2>Save Day 1</h2><p>Finish this day\u2019s questions and four written responses. Save your daily report before leaving. Keep using the same browser to resume your work when local storage is available. Submit your report in Canvas as directed by Mrs. Rees.</p><button class=\"dayreport\" data-day=\"1\">My Day 1 report</button><button class=\"daydownload\" data-day=\"1\">Download Day 1 (.txt)</button><button class=\"dayprint\" data-day=\"1\">Print / save Day 1 PDF</button><div class=\"dailyreport\" id=\"dailyreport1\" aria-live=\"polite\"></div>"}, {"title": "D2 \u2022 Writing with a purpose", "body": "<h2>Day 2: Your learning goals</h2><p><b>Focus:</b> Introduction to 6.C.1 and 6.R.3; K12.EE.4.1. Focused bridge: paraphrasing (ELA.6.R.3.2).</p><div class=\"callout\"><b>I can\u2026</b><ul><li>Choose a purpose, audience, and useful details for writing.</li><li>Distinguish narrating, explaining, and arguing.</li><li>Paraphrase accurately across text types.</li><li>Discuss ideas by listening, using evidence, and building on others\u2019 thinking.</li></ul></div><p>Follow your teacher through the explanations. Pause when you see <b>TRY WITH ME</b>. Work on your own when you see <b>INDEPENDENT</b>. Read the feedback after committing to an answer.</p><h2>WATCH ME: Writing begins with a decision</h2><p>Before drafting, ask <b>Why am I writing? Who will read this? What does that reader need?</b> A clear purpose helps you choose relevant details and an appropriate structure.</p><table><tr><th>Writing purpose</th><th>What readers need</th><th>Example plan</th></tr><tr><td>Narrate an experience</td><td>A sequence, meaningful details, and reflection.</td><td>Tell how I learned to ask for help during a group project.</td></tr><tr><td>Explain a topic</td><td>Accurate information and clear connections.</td><td>Explain how a book exchange operates.</td></tr><tr><td>Support a position</td><td>A claim, relevant reasons, and evidence.</td><td>Argue that the school should continue the book exchange.</td></tr></table><p>This is an introduction to the writing standard group, not a complete lesson on every writing benchmark. Today you will practice a clear explanatory paragraph and the decisions behind it.</p><div class=\"passage\"><h3>Watch a paragraph grow</h3><p><b>Too vague:</b> \u201cThe exchange is good. It has stuff. People like it.\u201d</p><p><b>Clearer:</b> \u201cThe book exchange gives students a way to find a different book without buying one. A student brings a book in good condition and chooses a donated book. This process keeps usable books circulating among readers.\u201d</p><p><b>Why it works:</b> The first sentence names the point. The middle explains the process. The ending explains its significance. Specific words replace \u201cgood,\u201d \u201cstuff,\u201d and \u201cpeople.\u201d</p></div><div class=\"callout\"><b>Plan \u2192 Draft \u2192 Reread \u2192 Revise.</b><p>Revision improves ideas and organization. Editing checks grammar, spelling, and punctuation. Both matter, but they solve different problems.</p></div><div class=\"question\" data-id=\"q11\" data-answer=\"2\" data-why=\"The process detail answers the explanatory purpose.\"><span class=\"badge\">Select one</span><h3>Which detail is most relevant when explaining HOW a book exchange works?</h3><label class=\"option\"><input type=\"radio\" name=\"q11\" value=\"0\"> The writer\u2019s favorite sandwich.</label><label class=\"option\"><input type=\"radio\" name=\"q11\" value=\"1\"> The color of every hallway wall.</label><label class=\"option\"><input type=\"radio\" name=\"q11\" value=\"2\"> Students bring a book and select another donated book.</label><label class=\"option\"><input type=\"radio\" name=\"q11\" value=\"3\"> A claim that every reader likes the same genre.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q12\" data-answer=\"1\" data-why=\"It names a specific benefit rather than adding vague praise.\"><span class=\"badge\">Select one</span><h3>Which revision makes \u201cThe exchange is good\u201d more precise?</h3><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"0\"> The exchange is really, really good.</label><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"1\"> The exchange helps usable books reach new readers.</label><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"2\"> Good is the exchange.</label><label class=\"option\"><input type=\"radio\" name=\"q12\" value=\"3\"> Stuff happens there.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q13\" data-answer=\"0\" data-why=\"Adding needed reasoning is revision, not only surface editing.\"><span class=\"badge\">Select one</span><h3>A student adds a missing explanation connecting two ideas. What is the student doing?</h3><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"0\"> Revising meaning and clarity.</label><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"1\"> Only checking spelling.</label><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"2\"> Changing the topic randomly.</label><label class=\"option\"><input type=\"radio\" name=\"q13\" value=\"3\"> Removing the purpose.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div>"}, {"title": "D2 \u2022 Read across genres", "body": "<h2>WATCH ME: Different text types, shared reading habits</h2><p>A <b>genre</b> is a type of text. A narrative presents events; an informational text explains; a poem often uses concentrated language and patterned lines. A title and form give clues, but read the actual words before making a claim.</p><h3>Paraphrase without changing the meaning</h3><p>To <b>paraphrase</b>, restate a specific passage in your own wording and sentence structure while preserving its meaning. A summary condenses a larger text to key ideas. A direct quotation uses the author\u2019s exact words and quotation marks.</p><ol><li>Read for meaning.</li><li>Look away and restate the idea.</li><li>Compare with the source: keep important qualifications, quantities, and relationships.</li><li>Credit the source as your teacher directs. A paraphrase still uses another writer\u2019s ideas.</li></ol><div class=\"passage\"><p><b>Original:</b> \u201cStudents may exchange one gently used book for another during lunch on Friday.\u201d</p><p><b>Faithful paraphrase:</b> \u201cOn Friday at lunchtime, a student can bring one book in good condition and trade it for a different one.\u201d</p><p><b>Unfaithful version:</b> \u201cStudents must bring three new books every day.\u201d This changes permission to a requirement, one to three, used to new, and Friday to every day.</p></div><p>Paraphrasing poetry may require interpreting an image while preserving the idea. Do not claim the poet literally did something that the poem presents figuratively.</p><div class=\"question\" data-id=\"q14\" data-answer=\"1\" data-why=\"Sometimes becomes on some occasions. The people and timing remain accurate.\"><span class=\"badge\">Select one</span><h3>Which paraphrase preserves \u201cThe volunteers sometimes opened the room before school\u201d?</h3><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"0\"> The room was always open all night.</label><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"1\"> On some occasions, volunteers opened the room before classes began.</label><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"2\"> Students were required to open it after school every day.</label><label class=\"option\"><input type=\"radio\" name=\"q14\" value=\"3\"> No one opened the room.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q15\" data-answer=\"2\" data-why=\"Own wording and structure must still faithfully represent the source; attribution remains important.\"><span class=\"badge\">Select one</span><h3>Which action is necessary when paraphrasing?</h3><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"0\"> Replace one word and keep everything else copied.</label><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"1\"> Add an unsupported claim to make the passage interesting.</label><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"2\"> Preserve the meaning and credit the source as directed.</label><label class=\"option\"><input type=\"radio\" name=\"q15\" value=\"3\"> Turn every statement into the opposite.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q16\" data-answer=\"0\" data-why=\"The difference is scope and degree of condensation, not whether accuracy matters.\"><span class=\"badge\">Select one</span><h3>What is the main difference between paraphrasing a passage and summarizing a whole article?</h3><label class=\"option\"><input type=\"radio\" name=\"q16\" value=\"0\"> A paraphrase restates specific content; a summary condenses the larger text\u2019s key ideas.</label><label class=\"option\"><input type=\"radio\" name=\"q16\" value=\"1\"> A summary must include every sentence exactly.</label><label class=\"option\"><input type=\"radio\" name=\"q16\" value=\"2\"> A paraphrase never uses the original meaning.</label><label class=\"option\"><input type=\"radio\" name=\"q16\" value=\"3\"> Only fiction can be summarized.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">TRY WITH ME: Paraphrase \u201cThe exchange offered books at no cost, but students could choose only one title each week.\u201d Keep the limit and the cost information. Credit it as \u201cBook Exchange lesson.\u201d<textarea id=\"d2guided\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label>"}, {"title": "D2 \u2022 Discuss and write independently", "body": "<div class=\"passage\"><h3>Text A: The Next Reader \u2022 Original narrative</h3><p><b>[1]</b> I held my old adventure book against my chest as I joined the exchange line. The cover was bent, but the story inside had traveled with me through three long car trips. I wanted a new book and, at the same time, did not want this one to disappear.</p><p><b>[2]</b> At the front table, Sam asked what kind of story I liked. Before I answered, a younger student pointed to my book and said he had been searching for that title. I handed it to him and described my favorite chapter without revealing the ending.</p><p><b>[3]</b> Sam placed a mystery novel in my hands. As I left, the younger student sat beside the window with my old book open. I realized I had not lost the story. I had given someone else a place to begin.</p></div><div class=\"passage\"><h3>Text B: A Book Finds Another Reader \u2022 Original poem</h3><p>My shelf had held a quiet door,<br>A story waiting to be known.<br>I carried it across the floor;<br>Its journey was no longer mine alone.</p><p>Another reader turned a page.<br>I found a mystery to explore.<br>Two lives had met upon a stage<br>Of paper, ink, and something more.</p></div><h2>TRY WITH ME: A productive discussion</h2><p><b>Prompt:</b> How do both texts present giving a book to someone else?</p><table><tr><th>Role</th><th>Useful contribution</th></tr><tr><td>Speaker</td><td>State an idea and point to text evidence.</td></tr><tr><td>Listener</td><td>Let the speaker finish; restate their idea accurately.</td></tr><tr><td>Questioner</td><td>Ask \u201cWhich detail supports that?\u201d or \u201cHow does that connect?\u201d</td></tr><tr><td>Connector</td><td>Build on or respectfully challenge the idea with evidence.</td></tr></table><p><b>Model:</b> \u201cI hear you saying the narrator is only sad. I agree the beginning shows reluctance. However, the ending suggests a change because the narrator sees the younger student reading and describes a new beginning.\u201d</p><p>With a partner, take turns. If working alone, write both sides of a possible exchange. The tutorial records written reflections; your teacher observes actual listening and speaking.</p><div class=\"question\" data-id=\"q17\" data-answer=\"0\" data-why=\"The narrative ends with another reader beginning; the poem presents the book\u2019s shared journey.\"><span class=\"badge\">Select one</span><h3>Which idea is supported by BOTH texts?</h3><label class=\"option\"><input type=\"radio\" name=\"q17\" value=\"0\"> Exchanging books can connect readers and create new opportunities.</label><label class=\"option\"><input type=\"radio\" name=\"q17\" value=\"1\"> Giving a book away always destroys its meaning.</label><label class=\"option\"><input type=\"radio\" name=\"q17\" value=\"2\"> Only adventure stories are valuable.</label><label class=\"option\"><input type=\"radio\" name=\"q17\" value=\"3\"> Every reader chooses the same title.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q18\" data-answer=\"1\" data-why=\"The paraphrase preserves the realization without turning the figurative beginning into an unsupported literal claim.\"><span class=\"badge\">Select one</span><h3>Which paraphrase best preserves the final idea of Text A?</h3><label class=\"option\"><input type=\"radio\" name=\"q18\" value=\"0\"> The narrator burns the adventure book.</label><label class=\"option\"><input type=\"radio\" name=\"q18\" value=\"1\"> The narrator realizes the shared book gives another person a chance to enjoy its story.</label><label class=\"option\"><input type=\"radio\" name=\"q18\" value=\"2\"> The younger student hates the book.</label><label class=\"option\"><input type=\"radio\" name=\"q18\" value=\"3\"> The narrator never cared about reading.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q19\" data-answer=\"2\" data-why=\"Listening, accurate restatement, and evidence make a respectful disagreement productive.\"><span class=\"badge\">Select one</span><h3>Which response follows effective discussion expectations?</h3><label class=\"option\"><input type=\"radio\" name=\"q19\" value=\"0\"> Interrupt and say, \u201cWrong.\u201d</label><label class=\"option\"><input type=\"radio\" name=\"q19\" value=\"1\"> Ignore the text and change the topic.</label><label class=\"option\"><input type=\"radio\" name=\"q19\" value=\"2\"> Restate a partner\u2019s idea, then support a different interpretation with a detail.</label><label class=\"option\"><input type=\"radio\" name=\"q19\" value=\"3\"> Agree with everything without listening.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q20\" data-answer=\"0,2\" data-why=\"The reading action and the shared-journey line both develop the relevant idea.\"><span class=\"badge\">Select 2</span><h3>Which TWO details best support the idea of sharing a story\u2019s journey?</h3><label class=\"option\"><input type=\"checkbox\" name=\"q20\" value=\"0\"> Text A: the younger student reads the old book by the window.</label><label class=\"option\"><input type=\"checkbox\" name=\"q20\" value=\"1\"> Text A: the cover is bent.</label><label class=\"option\"><input type=\"checkbox\" name=\"q20\" value=\"2\"> Text B: \u201cIts journey was no longer mine alone.\u201d</label><label class=\"option\"><input type=\"checkbox\" name=\"q20\" value=\"3\"> Text B: the poem has periods.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">INDEPENDENT: Write a 5\u20137 sentence explanatory paragraph about how the two texts present sharing books. State a clear point, paraphrase one detail from each, explain the connection, and end with a meaningful conclusion. Refer to Text A and Text B.<textarea id=\"d2apply\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label><label class=\"writing\">Discussion reflection: Write a partner\u2019s idea (or a possible idea if working alone). Restate it fairly, then build on it or respectfully challenge it using text evidence.<textarea id=\"d2discuss\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label>"}, {"title": "D2 \u2022 Revise and reflect", "body": "<h2>Reread your paragraph like a reader</h2><ul><li>Can a reader find my main point?</li><li>Does my paraphrase preserve the original meaning?</li><li>Did I explain how each detail supports my point?</li><li>Are sentences complete and connected?</li><li>Did I credit both texts?</li></ul><div class=\"callout\"><b>Remember:</b> Purpose + audience guide writing.<br>Paraphrase = new wording, same meaning.<br>Listen \u2192 restate \u2192 respond with evidence.</div><label class=\"writing\">Exit ticket: Copy ONE sentence from your draft that needs improvement, then write a stronger version. Explain what you changed and why.<textarea id=\"d2exit\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label><h2>Save Day 2</h2><p>Finish this day\u2019s questions and four written responses. Save your daily report before leaving. Keep using the same browser to resume your work when local storage is available. Submit your report in Canvas as directed by Mrs. Rees.</p><button class=\"dayreport\" data-day=\"2\">My Day 2 report</button><button class=\"daydownload\" data-day=\"2\">Download Day 2 (.txt)</button><button class=\"dayprint\" data-day=\"2\">Print / save Day 2 PDF</button><div class=\"dailyreport\" id=\"dailyreport2\" aria-live=\"polite\"></div>"}, {"title": "D3 \u2022 Read informational text", "body": "<h2>Day 3: Your learning goals</h2><p><b>Focus:</b> Introduction to 6.R.2; ELA.6.R.2.1 and K12.EE.2.1.</p><div class=\"callout\"><b>I can\u2026</b><ul><li>Preview an informational text and set a reading goal.</li><li>Explain how a section contributes to the whole text.</li><li>Explain how titles, headings, captions, and tables convey meaning.</li><li>Use rereading and evidence to understand a challenging text.</li></ul></div><p>Follow your teacher through the explanations. Pause when you see <b>TRY WITH ME</b>. Work on your own when you see <b>INDEPENDENT</b>. Read the feedback after committing to an answer.</p><h2>WATCH ME: Preview with a purpose</h2><p>Informational texts help readers understand topics, events, processes, and ideas. A feature may help you navigate or interpret, but you must explain what it contributes to THIS text.</p><table><tr><th>Feature</th><th>What to ask</th></tr><tr><td>Title</td><td>Which topic or idea does it emphasize?</td></tr><tr><td>Heading</td><td>What is this section\u2019s focus, and how does it fit the whole?</td></tr><tr><td>Caption</td><td>What important detail does it clarify about the visual?</td></tr><tr><td>Table</td><td>What information is organized, and what comparison can I make?</td></tr><tr><td>Opening / ending</td><td>What idea is introduced or brought together?</td></tr></table><div class=\"callout\"><b>Preview \u2192 Question \u2192 Read \u2192 Check.</b><p>Preview a title and headings. Set a goal. Read for the answer. Reread when details complicate your prediction.</p></div><p><b>Example preview:</b> Title: \u201cMore Than a Shelf.\u201d Headings: \u201cAn Access Problem,\u201d \u201cA Shared System,\u201d \u201cLearning from the Record,\u201d and \u201cWhat Comes Next.\u201d</p><p><b>Think-aloud:</b> I predict the article explains a book-sharing system and evaluates how it works. My goal is to understand how the system addresses access and what the record does\u2014and does not\u2014show. I will revise that prediction if the text leads elsewhere.</p><p>Complex reading does not mean understanding every sentence instantly. Pause at unfamiliar words, long sentences, qualifications such as \u201cmay,\u201d and changes in ideas. Ask what you know, what you need to reread, and which detail supports your understanding.</p><div class=\"question\" data-id=\"q21\" data-answer=\"1\" data-why=\"The goal follows the preview and focuses comprehension without assuming the conclusion.\"><span class=\"badge\">Select one</span><h3>Which reading goal best fits this preview?</h3><label class=\"option\"><input type=\"radio\" name=\"q21\" value=\"0\"> Find only the longest word.</label><label class=\"option\"><input type=\"radio\" name=\"q21\" value=\"1\"> Understand the access problem, the response, and what the evidence shows.</label><label class=\"option\"><input type=\"radio\" name=\"q21\" value=\"2\"> Prove the article is about furniture prices without reading.</label><label class=\"option\"><input type=\"radio\" name=\"q21\" value=\"3\"> Ignore all headings.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q22\" data-answer=\"3\" data-why=\"It identifies both what the feature organizes and the meaning it makes available.\"><span class=\"badge\">Select one</span><h3>Which explanation goes beyond simply naming a feature?</h3><label class=\"option\"><input type=\"radio\" name=\"q22\" value=\"0\"> The heading is bold.</label><label class=\"option\"><input type=\"radio\" name=\"q22\" value=\"1\"> The table has rows.</label><label class=\"option\"><input type=\"radio\" name=\"q22\" value=\"2\"> The caption is under a picture.</label><label class=\"option\"><input type=\"radio\" name=\"q22\" value=\"3\"> The table organizes participation by week, helping readers see a change over time.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q23\" data-answer=\"0\" data-why=\"Active readers update their understanding when evidence changes it.\"><span class=\"badge\">Select one</span><h3>What should you do if the article does not support your first prediction?</h3><label class=\"option\"><input type=\"radio\" name=\"q23\" value=\"0\"> Revise the prediction based on the text.</label><label class=\"option\"><input type=\"radio\" name=\"q23\" value=\"1\"> Keep it because the title is always complete proof.</label><label class=\"option\"><input type=\"radio\" name=\"q23\" value=\"2\"> Skip the ending.</label><label class=\"option\"><input type=\"radio\" name=\"q23\" value=\"3\"> Replace the text\u2019s evidence with your opinion.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div>"}, {"title": "D3 \u2022 Follow the sections", "body": "<div class=\"passage\"><h3>More Than a Shelf \u2022 Original informational article</h3><h4>An Access Problem</h4><p><b>[1]</b> A fictional school reading club wanted students to find books that matched their interests. Some students had finished the books at home but could not regularly visit a public library. Others owned books they no longer planned to read. The club proposed an exchange so usable books could move from one reader to another.</p><h4>A Shared System</h4><p><b>[2]</b> Volunteers placed a small cabinet outside the school library. Students could donate books in good condition and choose one donated title each week, even if they had not donated a book themselves. The club separated picture books, novels, and informational books into labeled sections. Labels helped students locate a type of book without examining every cover.</p><p><b>[3]</b> The cabinet alone was not the whole system. Two volunteers checked the condition of donations and recorded how many different students selected books each week. They also noted questions readers asked. When several students asked for mysteries, the club requested more mystery donations instead of simply filling every shelf with whatever arrived.</p><figure><svg viewBox=\"0 0 440 180\" role=\"img\" aria-label=\"Book cabinet with labeled picture books, novels, and information shelves\" style=\"width:100%;max-width:440px\"><rect x=\"10\" y=\"10\" width=\"420\" height=\"160\" rx=\"10\" fill=\"#dff2f1\" stroke=\"#087f8c\" stroke-width=\"3\"/><path d=\"M10 64H430M10 118H430\" stroke=\"#087f8c\" stroke-width=\"3\"/><text x=\"28\" y=\"46\" font-size=\"20\" fill=\"#173f49\">Picture books</text><text x=\"28\" y=\"100\" font-size=\"20\" fill=\"#173f49\">Novels</text><text x=\"28\" y=\"154\" font-size=\"20\" fill=\"#173f49\">Informational books</text></svg><figcaption><b>Caption:</b> Labels organize books by type so readers can begin their search in a relevant section.</figcaption></figure><h4>Learning from the Record</h4><p><b>[4]</b> The club recorded participation during three weeks. The number of different students selecting books increased each week. However, the record did not track whether those students finished their books or enjoyed them. More participation suggested growing use of the exchange; it did not prove that every student had become a stronger reader.</p><table><caption><b>Different students selecting a book in each week</b></caption><tr><th>Week</th><th>Students</th></tr><tr><td>1</td><td>18</td></tr><tr><td>2</td><td>24</td></tr><tr><td>3</td><td>31</td></tr></table><p class=\"muted\">A student may appear in more than one week. These counts do not represent 73 unique students across all three weeks.</p><h4>What Comes Next</h4><p><b>[5]</b> The club decided to ask readers what they liked and which books they hoped to find. It also planned to keep checking donations and arranging shelves. A cabinet could provide a place for books, but a responsive exchange required people to maintain it and learn from its users.</p></div><h2>WATCH ME: Explain a section\u2019s job</h2><p>The opening describes a mismatch: some readers need books while others have unused ones. \u201cA Shared System\u201d explains the response. \u201cLearning from the Record\u201d evaluates what the club knows and what remains unknown. The ending turns those limits into next steps.</p><p><b>Strong explanation:</b> \u201cThe record section contributes to the whole article by showing increased use while warning that participation alone does not measure completed reading or improvement. This prepares readers to understand why the club asks follow-up questions.\u201d</p><p><b>Weak explanation:</b> \u201cThe section is about records.\u201d It names a topic but does not explain contribution.</p><div class=\"callout\"><b>Feature \u2192 meaning \u2192 contribution.</b><p>The cabinet labels separate genres \u2192 readers can locate a relevant type \u2192 the article shows how organization supports access.</p></div><div class=\"question\" data-id=\"q24\" data-answer=\"0\" data-why=\"The opening explains why unused books and limited access create a reason for the exchange.\"><span class=\"badge\">Select one</span><h3>What is the main contribution of \u201cAn Access Problem\u201d?</h3><label class=\"option\"><input type=\"radio\" name=\"q24\" value=\"0\"> It establishes the need that motivates the exchange.</label><label class=\"option\"><input type=\"radio\" name=\"q24\" value=\"1\"> It proves that all students hate reading.</label><label class=\"option\"><input type=\"radio\" name=\"q24\" value=\"2\"> It explains how to build a cabinet from wood.</label><label class=\"option\"><input type=\"radio\" name=\"q24\" value=\"3\"> It repeats every table value.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q25\" data-answer=\"1\" data-why=\"Participation counts do not reveal enjoyment or completion, motivating the club to seek additional information.\"><span class=\"badge\">Select one</span><h3>How does \u201cLearning from the Record\u201d connect to \u201cWhat Comes Next\u201d?</h3><label class=\"option\"><input type=\"radio\" name=\"q25\" value=\"0\"> The record proves no further questions are needed.</label><label class=\"option\"><input type=\"radio\" name=\"q25\" value=\"1\"> The limits of the record help explain why the club plans to ask readers follow-up questions.</label><label class=\"option\"><input type=\"radio\" name=\"q25\" value=\"2\"> The two sections describe unrelated schools.</label><label class=\"option\"><input type=\"radio\" name=\"q25\" value=\"3\"> The ending removes all volunteer responsibilities.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q26\" data-answer=\"2\" data-why=\"The caption interprets the visual\u2019s labels and connects organization to access.\"><span class=\"badge\">Select one</span><h3>How does the caption contribute to the article?</h3><label class=\"option\"><input type=\"radio\" name=\"q26\" value=\"0\"> It lists every student\u2019s name.</label><label class=\"option\"><input type=\"radio\" name=\"q26\" value=\"1\"> It tells readers that labels prove reading improvement.</label><label class=\"option\"><input type=\"radio\" name=\"q26\" value=\"2\"> It explains how organizing by book type helps readers find a starting point.</label><label class=\"option\"><input type=\"radio\" name=\"q26\" value=\"3\"> It says every book belongs in the same category.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">TRY WITH ME: Explain how the heading \u201cA Shared System\u201d helps readers understand paragraphs 2\u20133. Include one detail showing why the cabinet needs more than shelves.<textarea id=\"d3guided\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label>"}, {"title": "D3 \u2022 Independent reading lab", "body": "<h2>INDEPENDENT: Use the article, not just your memory</h2><p>Return to \u201cMore Than a Shelf\u201d in the previous tab whenever you need it. Reread the table label, note, and surrounding paragraphs. Strong comprehension includes noticing what a text does NOT establish.</p><p><b>Three reading passes:</b> First find the overall point. Next inspect important details and relationships. Finally answer the question and check whether your evidence really supports it.</p><div class=\"question\" data-id=\"q27\" data-answer=\"2\" data-why=\"The table records increasing weekly participation. It does not count unique participants across weeks, completion, or test scores.\"><span class=\"badge\">Select one</span><h3>What conclusion is directly supported by the table?</h3><label class=\"option\"><input type=\"radio\" name=\"q27\" value=\"0\"> Exactly 73 different students participated overall.</label><label class=\"option\"><input type=\"radio\" name=\"q27\" value=\"1\"> Every student finished a selected book.</label><label class=\"option\"><input type=\"radio\" name=\"q27\" value=\"2\"> The weekly number of students selecting books increased from 18 to 31.</label><label class=\"option\"><input type=\"radio\" name=\"q27\" value=\"3\"> Reading scores increased by 13 points.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q28\" data-answer=\"0,1\" data-why=\"Both details show the club responding to information from users rather than merely providing a shelf.\"><span class=\"badge\">Select 2</span><h3>Which TWO details support the idea that the exchange adapts to readers\u2019 needs?</h3><label class=\"option\"><input type=\"checkbox\" name=\"q28\" value=\"0\"> The club requests mysteries after readers ask for them.</label><label class=\"option\"><input type=\"checkbox\" name=\"q28\" value=\"1\"> The club plans to ask readers which books they hope to find.</label><label class=\"option\"><input type=\"checkbox\" name=\"q28\" value=\"2\"> The cabinet is small.</label><label class=\"option\"><input type=\"checkbox\" name=\"q28\" value=\"3\"> The first weekly count is 18.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q29\" data-answer=\"0\" data-why=\"The numbers show increased use, while the paragraph clarifies what participation does and does not demonstrate.\"><span class=\"badge\">Select one</span><h3>Which statement most accurately explains how the table and paragraph 4 work together?</h3><label class=\"option\"><input type=\"radio\" name=\"q29\" value=\"0\"> The table shows a pattern; the paragraph explains that pattern and limits what can be concluded.</label><label class=\"option\"><input type=\"radio\" name=\"q29\" value=\"1\"> The paragraph says every book was finished, and the table proves it.</label><label class=\"option\"><input type=\"radio\" name=\"q29\" value=\"2\"> The table makes the paragraph unnecessary for understanding.</label><label class=\"option\"><input type=\"radio\" name=\"q29\" value=\"3\"> Both prove that all students participated only once.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><div class=\"question\" data-id=\"q30\" data-answer=\"1\" data-why=\"The article develops a system that includes books, organization, volunteers, records, and responsive next steps.\"><span class=\"badge\">Select one</span><h3>Which sentence best expresses the article\u2019s overall point?</h3><label class=\"option\"><input type=\"radio\" name=\"q30\" value=\"0\"> A cabinet alone guarantees reading success.</label><label class=\"option\"><input type=\"radio\" name=\"q30\" value=\"1\"> An effective book exchange combines access, organization, maintenance, and attention to readers\u2019 needs.</label><label class=\"option\"><input type=\"radio\" name=\"q30\" value=\"2\"> Tables are always more important than paragraphs.</label><label class=\"option\"><input type=\"radio\" name=\"q30\" value=\"3\"> Every donated book is a mystery.</label><button class=\"check\">Check & learn</button><p class=\"feedback\" aria-live=\"polite\"></p></div><label class=\"writing\">Explain how the table helps readers understand the exchange. State ONE supported conclusion and ONE conclusion it cannot support. Use numbers and the note below the table.<textarea id=\"d3apply\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label><label class=\"writing\">Write a 5\u20137 sentence explanation of how TWO different sections work together to convey the article\u2019s overall point. Refer to their headings and paraphrase relevant details.<textarea id=\"d3transfer\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label>"}, {"title": "D3 \u2022 Connect the three days", "body": "<h2>Your beginning-of-year reading toolkit</h2><table><tr><th>Day 1</th><th>Day 2</th><th>Day 3</th></tr><tr><td>Decode task words and word parts.</td><td>Write with purpose, paraphrase faithfully, and discuss respectfully.</td><td>Connect sections and features to meaning; check evidence carefully.</td></tr></table><p>These skills work together. You can analyze a table, justify an interpretation, paraphrase a relevant paragraph, and discuss it respectfully\u2014all in one reading task.</p><label class=\"writing\">Exit ticket: Explain one way the three days connect. Then name the strategy you will use first when a new reading assignment feels confusing.<textarea id=\"d3exit\" rows=\"4\" placeholder=\"Write your own explanation. Use details from the lesson or text.\"></textarea></label><h2>Save Day 3</h2><p>Finish this day\u2019s questions and four written responses. Save your daily report before leaving. Keep using the same browser to resume your work when local storage is available. Submit your report in Canvas as directed by Mrs. Rees.</p><button class=\"dayreport\" data-day=\"3\">My Day 3 report</button><button class=\"daydownload\" data-day=\"3\">Download Day 3 (.txt)</button><button class=\"dayprint\" data-day=\"3\">Print / save Day 3 PDF</button><div class=\"dailyreport\" id=\"dailyreport3\" aria-live=\"polite\"></div><h2>All three days</h2><button id=\"reportBtn\">My full completion report</button><button id=\"downloadBtn\">Download full report (.txt)</button><button id=\"printBtn\">Print / save full PDF</button><div id=\"report\" aria-live=\"polite\"></div><p class=\"muted\">The broad groups 6.C.1, 6.R.3, and 6.R.2 are introduced through selected foundational skills; this three-day tutorial does not cover every benchmark in those groups. Original texts and practice. <a href=\"https://www.fldoe.org/core/fileparse.php/20070/urlt/12-3.pdf\">Florida B.E.S.T. ELA reference</a>.</p>"}];
let page=0,answers={},checks={},fields={},seconds=0;const KEY='threeDayELAFoundations_v1';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){page=s.page||0;answers=s.answers||{};checks=s.checks||{};fields=s.fields||{};seconds=s.seconds||0}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({page,answers,checks,fields,seconds}))}catch(e){}}
function capture(){document.querySelectorAll('#panel input[type=radio],#panel input[type=checkbox]').forEach(el=>{if(!answers[el.name])answers[el.name]=[];});document.querySelectorAll('.question').forEach(el=>answers[el.dataset.id]=[...el.querySelectorAll('input:checked')].map(x=>+x.value));document.querySelectorAll('#panel textarea,#student').forEach(el=>fields[el.id]=el.value);save()}
function render(){document.getElementById('panel').innerHTML='<span class="badge">Section '+(page+1)+' of 12</span>'+sections[page].body;document.getElementById('nav').innerHTML=sections.map((s,i)=>i>=Math.floor(page/4)*4&&i<Math.floor(page/4)*4+4?'<button class="'+(i===page?'current':'')+'" data-page="'+i+'">'+(i+1)+'. '+s.title+'</button>':'').join('');document.getElementById('progress').value=page+1;document.getElementById('back').disabled=page===0;document.getElementById('next').disabled=page===11;document.querySelectorAll('#panel input[type=radio],#panel input[type=checkbox]').forEach(el=>el.checked=(answers[el.name]||[]).includes(+el.value));document.querySelectorAll('#panel textarea,#student').forEach(el=>el.value=fields[el.id]||'');document.querySelectorAll('.question').forEach(el=>{if(checks[el.dataset.id])showFeedback(el)});save()}
function showFeedback(el){const c=checks[el.dataset.id],f=el.querySelector('.feedback');f.style.display='block';f.textContent=(c.correct?'Correct. ':'Revisit this. ')+el.dataset.why+' Correct choice(s): '+el.dataset.answer.split(',').map(v=>el.querySelector('input[value="'+v+'"]').parentElement.textContent.trim()).join(' | ')}
document.addEventListener('input',e=>{if(e.target.closest('#panel')){if(e.target.name){delete checks[e.target.name];const f=e.target.closest('.question').querySelector('.feedback');f.style.display='none'}capture()}});
document.addEventListener('click',e=>{if(e.target.dataset.page!==undefined){capture();page=+e.target.dataset.page;render();window.scrollTo(0,0)}if(e.target.classList.contains('check')){capture();let el=e.target.closest('.question'),got=answers[el.dataset.id]||[],wanted=el.dataset.answer.split(',').map(Number);if(!got.length){el.querySelector('.feedback').style.display='block';el.querySelector('.feedback').textContent='Choose an answer first.';return}checks[el.dataset.id]={correct:got.length===wanted.length&&wanted.every(v=>got.includes(v))};showFeedback(el);save()}if(e.target.id==='reportBtn')makeReport();if(e.target.id==='printBtn'){makeReport();window.print()}if(e.target.id==='downloadBtn'){const txt=makeReport();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='Three-Day-ELA-Completion-Report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
document.getElementById('back').onclick=()=>{capture();page--;render();window.scrollTo(0,0)};document.getElementById('next').onclick=()=>{capture();page++;render();window.scrollTo(0,0)};
function makeReport(){capture();const ids=Array.from({length:30},(_,i)=>'q'+(i+1)),written=["d1guided", "d1apply", "d1transfer", "d1exit", "d2guided", "d2apply", "d2discuss", "d2exit", "d3guided", "d3apply", "d3transfer", "d3exit"];const done=ids.filter(id=>checks[id]).length,correct=ids.filter(id=>checks[id]?.correct).length,w=written.filter(id=>(fields[id]||'').trim()).length;let t='THREE-DAY ELA FOUNDATIONS • COMPLETION REPORT\nStudent: '+(fields.student||'[Name missing]')+'\nDate: '+new Date().toLocaleString()+'\nStatus: '+(done===30&&w===12&&fields.student?.trim()?'All required fields completed':'Incomplete — review missing work')+'\nPractice checked: '+done+'/30\nCurrent correct after feedback/retries: '+correct+'/30 (practice, not mastery score)\nWritten responses: '+w+'/12 (teacher review required)\nActive page time: '+Math.floor(seconds/60)+' minutes; time is not proof of learning.\n';ids.forEach(id=>{t+='\n'+id.toUpperCase()+': '+(!checks[id]?'Not checked':checks[id].correct?'Correct':'Needs review')});written.forEach(id=>t+='\n\n'+id.toUpperCase()+':\n'+(fields[id]||'[Missing]'));document.getElementById('report').textContent=t;return t}

const dayFields=[["d1guided", "d1apply", "d1transfer", "d1exit"], ["d2guided", "d2apply", "d2discuss", "d2exit"], ["d3guided", "d3apply", "d3transfer", "d3exit"]];
function dayReport(day){capture();const ids=Array.from({length:10},(_,i)=>'q'+((day-1)*10+i+1)),written=dayFields[day-1],done=ids.filter(id=>checks[id]).length,correct=ids.filter(id=>checks[id]?.correct).length,w=written.filter(id=>(fields[id]||'').trim()).length;let t='DAY '+day+' • ELA FOUNDATIONS REPORT\nStudent: '+(fields.student||'[Name missing]')+'\nDate: '+new Date().toLocaleString()+'\nStatus: '+(done===10&&w===4&&fields.student?.trim()?'All required fields completed':'Incomplete — review missing work')+'\nPractice checked: '+done+'/10\nCurrent correct after feedback/retries: '+correct+'/10 (practice, not a mastery score)\nWriting completed: '+w+'/4 (teacher review required)\n';ids.forEach(id=>t+='\n'+id.toUpperCase()+': '+(!checks[id]?'Not checked':checks[id].correct?'Correct':'Needs review'));written.forEach(id=>t+='\n\n'+id.toUpperCase()+':\n'+(fields[id]||'[Missing]'));document.getElementById('dailyreport'+day).textContent=t;return t}
document.addEventListener('click',e=>{if(e.target.dataset.start!==undefined){capture();page=+e.target.dataset.start;render();window.scrollTo(0,0)}if(e.target.classList.contains('dayreport'))dayReport(+e.target.dataset.day);if(e.target.classList.contains('daydownload')){const day=+e.target.dataset.day,txt=dayReport(day),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='ELA-Foundations-Day-'+day+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}if(e.target.classList.contains('dayprint')){const day=+e.target.dataset.day;dayReport(day);document.body.classList.add('dailyprint');document.getElementById('dailyreport'+day).classList.add('printme');window.print()}});
window.addEventListener('afterprint',()=>{document.body.classList.remove('dailyprint');document.querySelectorAll('.printme').forEach(el=>el.classList.remove('printme'))});

setInterval(()=>{if(!document.hidden){seconds++;if(seconds%10===0)save()}},1000);render();
</script></body></html>
